name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "src/api/**"
      - "src/core/**"
      - "src/modules/**"
      - "src/lib/**"
      - "src/jobs/**"
      - "prisma/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.api.json"
      - "Dockerfile"
      - "docker-compose.yml"

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

env:
  HUSKY: 0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          target: runner

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REGISTRY,IMAGE_NAME,GITHUB_SHA
          script: |
            set -e

            cd /opt/arcid

            # Pull the latest image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
            docker pull $REGISTRY/$IMAGE_NAME:$GITHUB_SHA

            # Update api + workers services to use the new image
            export API_IMAGE=$REGISTRY/$IMAGE_NAME:$GITHUB_SHA
            docker compose up -d --no-deps api workers
            docker image prune -f
